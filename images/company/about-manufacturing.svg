<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="manufacturingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34495E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C3E50;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#manufacturingGrad)"/>
  
  <!-- Factory building silhouette -->
  <rect x="50" y="200" width="500" height="150" fill="#1A252F"/>
  <rect x="100" y="150" width="60" height="50" fill="#1A252F"/>
  <rect x="200" y="130" width="80" height="70" fill="#1A252F"/>
  <rect x="340" y="160" width="60" height="40" fill="#1A252F"/>
  <rect x="450" y="140" width="70" height="60" fill="#1A252F"/>
  
  <!-- Smokestacks -->
  <rect x="120" y="100" width="8" height="50" fill="#1A252F"/>
  <rect x="140" y="90" width="8" height="60" fill="#1A252F"/>
  <rect x="380" y="110" width="8" height="50" fill="#1A252F"/>
  
  <!-- Windows -->
  <rect x="110" y="170" width="8" height="10" fill="#F39C12"/>
  <rect x="125" y="170" width="8" height="10" fill="#F39C12"/>
  <rect x="140" y="170" width="8" height="10" fill="#F39C12"/>
  
  <rect x="220" y="150" width="12" height="15" fill="#F39C12"/>
  <rect x="240" y="150" width="12" height="15" fill="#F39C12"/>
  <rect x="260" y="150" width="12" height="15" fill="#F39C12"/>
  
  <!-- Text overlay -->
  <text x="300" y="100" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">VERTEX INTERNATIONAL</text>
  <text x="300" y="130" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white">Manufacturing Facility</text>
  <text x="300" y="380" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">Dhaka, Bangladesh</text>
</svg>