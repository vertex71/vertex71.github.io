<svg width="150" height="150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="150" height="150" rx="12" fill="url(#flossGrad)"/>
  
  <!-- Floss container (circular) -->
  <circle cx="75" cy="60" r="25" fill="white" opacity="0.9"/>
  <circle cx="75" cy="60" r="20" fill="#2E86C1" opacity="0.3"/>
  
  <!-- Floss string coming out -->
  <path d="M 75 35 Q 85 25 95 30 Q 105 35 95 45" stroke="white" stroke-width="2" fill="none"/>
  
  <text x="75" y="65" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#2E86C1">MEDIDENT</text>
  
  <text x="75" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">MEDIDENT</text>
  <text x="75" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Dental Floss</text>
</svg>